<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd8098"><title>My 同人誌 Library</title><style>
:root{--accent:#bd8098;--bg:#faf0f3;--panel:#fff;--text:#453039;--muted:#806e77;--border:#eadde2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{position:sticky;top:0;background:var(--bg);z-index:3;padding:16px 16px 10px;border-bottom:1px solid var(--border)}h1{font-size:20px;margin:0}h2{font-size:18px}small,.muted{color:var(--muted)}main{max-width:850px;margin:auto;padding:15px 15px 95px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}.panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:14px;margin-bottom:12px}.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:11px 14px;font-size:14px;cursor:pointer}.btn.alt{background:#f2e6eb;color:var(--text)}.btn.danger{background:#a34058}.btn:disabled{opacity:.5}.full{width:100%}input,select,textarea{width:100%;border:1px solid #d8cbd0;background:white;color:#30262a;border-radius:9px;padding:11px;font:inherit;min-width:0}label{display:block;margin:13px 0 5px;font-weight:600;font-size:13px}.search{margin-top:10px}.tabs{display:flex;gap:6px;margin-top:10px}.tabs button{flex:1}.active{outline:2px solid var(--accent)}.shelf{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--border);border-radius:13px;background:white;padding:17px;margin:9px 0;color:var(--text);font:inherit}.folder{font-size:28px}.bookgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#e8d8df}.cover.placeholder{display:flex;align-items:center;justify-content:center;font-size:35px;color:#9b7887}.bookitem{min-width:0;cursor:pointer}.bookitem strong{display:block;font-size:12px;overflow-wrap:anywhere}.bookitem small{display:block;font-size:11px}.bookrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}.bookrow .cover{width:63px;flex:none}.bookrow .cover.placeholder{height:84px}.bookrow strong{overflow-wrap:anywhere}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters label{margin:0}.filters select{margin-top:5px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d7c1cb;border-radius:20px;background:#fff;padding:7px 10px;color:var(--text)}.chip.selected{background:var(--accent);color:white}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);display:flex;justify-content:center;padding:9px 9px calc(9px + env(safe-area-inset-bottom));z-index:4}.nav button{flex:1;max-width:180px;background:transparent;color:var(--muted);border:0;padding:6px;font-size:13px}.nav button.selected{color:var(--accent);font-weight:700}.hidden{display:none!important}.notice{padding:10px;border-radius:10px;background:#fff1d9;margin:10px 0;font-size:13px}.detailcover{width:150px;max-width:50%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}.pairline{display:flex;align-items:center;gap:8px;margin:6px 0}.pairline input{width:auto}.pairline label{margin:0;font-weight:400}.crumb{border:0;background:none;color:var(--accent);padding:5px;font:inherit}.stats{font-size:13px;color:var(--muted)}@media(min-width:600px){.bookgrid{grid-template-columns:repeat(5,minmax(0,1fr))}.filters{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class="row between"><div><h1>My 同人誌 Library</h1><small id="subtitle">わたしだけの本棚</small></div><button class="btn" id="addTop">＋ 登録</button></div></header><main id="app"></main><nav class="nav"><button data-nav="shelf" class="selected">▦ 本棚</button><button data-nav="all">☷ 全冊</button><button data-nav="settings">⚙ 設定</button></nav><input type="file" id="backupFile" accept="application/json,.json" class="hidden"><script>
'use strict';const DB='doujinshi-library-v1';let db,books=[],screen='shelf',genre=null,pair=null,view=localStorage.getItem('dl-view')||'grid',editing=null,coverData='',filter={},draftPairs=[],savedGenre='',newPairs=[];const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const unique=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));const val=id=>document.getElementById(id)?.value||'';const accent=localStorage.getItem('dl-accent')||'#bd8098';document.documentElement.style.setProperty('--accent',accent);
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('books',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function transaction(mode,fn){return new Promise((res,rej)=>{let t=db.transaction('books',mode),s=t.objectStore('books'),r=fn(s);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function reload(){books=await transaction('readonly',s=>s.getAll())}async function put(b){await transaction('readwrite',s=>s.put(b));await reload()}async function remove(id){await transaction('readwrite',s=>s.delete(id));await reload()}function navigate(to){screen=to;render()}function count(b){return b.length+'冊'}function img(b){return b.cover?`<img class="cover" src="${b.cover}" alt="表紙">`:'<div class="cover placeholder">📖</div>'}function bookCard(b){return view==='grid'?`<div class="bookitem" data-open="${esc(b.id)}">${img(b)}<strong>${esc(b.title)}</strong><small>${esc(b.circle)}</small></div>`:`<div class="bookrow" data-open="${esc(b.id)}">${img(b)}<div><strong>${esc(b.title)}</strong><div class="muted">${esc(b.circle)} · ${esc(b.author)}</div><small>${esc((b.pairs||[]).join(' / '))}</small></div></div>`}function viewToggle(){return `<div class="row"><span class="grow stats">${count(currentBooks().length?currentBooks():[])}（表示対象）</span><button class="btn alt ${view==='grid'?'active':''}" data-view="grid">▦ 表紙</button><button class="btn alt ${view==='list'?'active':''}" data-view="list">☷ 一覧</button></div>`}function currentBooks(){return books.filter(b=>(!genre||b.genre===genre)&&(!pair||pair==='__all__'||(b.pairs||[]).includes(pair)))}function shelf(){let h='<div class="row"><button class="crumb" data-root="1">本棚</button>';if(genre)h+=`› <button class="crumb" data-genreback="1">${esc(genre)}</button>`;if(pair)h+=`› <span>${esc(pair)}</span>`;h+='</div>';if(!genre){let gs=unique(books.map(b=>b.genre));h+=`<h2>原作・ジャンル別の本棚</h2><p class="stats">全${books.length}冊 · ${gs.length}ジャンル</p>`;h+=gs.map(g=>`<button class="shelf" data-genre="${esc(g)}"><span class="folder">📁</span><span class="grow"><strong>${esc(g)}</strong><br><small>${count(books.filter(b=>b.genre===g))}</small></span>›</button>`).join('');if(!gs.length)h+='<div class="panel">まだ本がありません。「＋ 登録」から最初の同人誌を追加しましょう。</div>'}else if(!pair){let bs=books.filter(b=>b.genre===genre),ps=unique(bs.flatMap(b=>b.pairs||[]));h+=`<h2>${esc(genre)}</h2><button class="shelf" data-pair="__all__"><span class="folder">📚</span><span class="grow">すべての本<br><small>${count(bs)}</small></span>›</button>`;h+=ps.map(p=>`<button class="shelf" data-pair="${esc(p)}"><span class="folder">📁</span><span class="grow">${esc(p)}<br><small>${count(bs.filter(b=>(b.pairs||[]).includes(p)))}</small></span>›</button>`).join('')}else{h+=`<h2>${esc(pair==='__all__'?'すべての本':pair)}</h2>`+listBooks(currentBooks().filter(b=>pair==='__all__'||(b.pairs||[]).includes(pair)))}return h}function option(items,selected,placeholder='すべて'){return `<option value="">${placeholder}</option>`+items.map(s=>`<option value="${esc(s)}" ${selected===s?'selected':''}>${esc(s)}</option>`).join('')}
function allPage(){const gs=unique(books.map(b=>b.genre)),ps=unique(books.flatMap(b=>b.pairs||[])),cs=unique(books.map(b=>b.circle)),as=unique(books.map(b=>b.author)),ls=unique(books.map(b=>b.location));return `<h2>すべての同人誌</h2><input id="search" class="search" placeholder="タイトル・サークル・作家・メモで検索" value="${esc(filter.q||'')}"><details class="panel" open><summary>絞り込み・並び替え</summary><div class="filters"><label>原作<select data-filter="genre">${option(gs,filter.genre)}</select></label><label>カップリング<select data-filter="pair">${option(ps,filter.pair)}</select></label><label>サークル<select data-filter="circle">${option(cs,filter.circle)}</select></label><label>作家<select data-filter="author">${option(as,filter.author)}</select></label><label>年齢区分<select data-filter="rating">${option(['全年齢','R18'],filter.rating)}</select></label><label>保管場所<select data-filter="location">${option(ls,filter.location)}</select></label><label>並び替え<select data-filter="sort"><option value="new">登録が新しい順</option><option value="title" ${filter.sort==='title'?'selected':''}>タイトル順</option><option value="price" ${filter.sort==='price'?'selected':''}>購入金額順</option></select></label></div><button class="btn alt" style="margin-top:12px" id="clearFilters">条件をクリア</button></details><div id="results"></div>`}function filtered(){let q=(filter.q||'').toLowerCase();let bs=books.filter(b=>[b.title,b.genre,b.circle,b.author,b.location,b.notes,...(b.pairs||[])].join(' ').toLowerCase().includes(q)&&['genre','pair','circle','author','rating','location'].every(k=>!filter[k]||(k==='pair'?(b.pairs||[]).includes(filter[k]):b[k]===filter[k])));return bs.sort((a,b)=>filter.sort==='title'?a.title.localeCompare(b.title,'ja'):filter.sort==='price'?Number(b.price||0)-Number(a.price||0):b.updated-a.updated)}function listBooks(bs){return viewToggle()+`<div class="${view==='grid'?'bookgrid':''}" style="margin-top:14px">${bs.map(bookCard).join('')}</div>`+(bs.length?'':'<p class="muted">該当する本はありません。</p>')}function updateResults(){let el=document.getElementById('results');if(el)el.innerHTML=listBooks(filtered())}function detail(id){let b=books.find(x=>x.id===id);if(!b)return;screen='detail';editing=id;app.innerHTML=`<button class="btn alt" id="back">← 戻る</button><div class="panel" style="margin-top:12px"><div class="row">${b.cover?`<img class="detailcover" src="${b.cover}" alt="表紙">`:''}<div><h2>${esc(b.title)}</h2><div>${esc(b.genre)}</div><small>${esc(b.rating)}</small></div></div><p><strong>CP：</strong>${esc((b.pairs||[]).join('、')||'未設定')}</p><p><strong>サークル：</strong>${esc(b.circle)}</p><p><strong>作家：</strong>${esc(b.author)}</p><p><strong>購入金額：</strong>${b.price!==''?esc(b.price)+'円':'未登録'}</p><p><strong>保管場所：</strong>${esc(b.location)}</p><p><strong>メモ・あらすじ：</strong></p><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(b.notes)}</p><div class="row"><button class="btn grow" id="edit">編集</button><button class="btn danger" id="delete">削除</button></div></div>`;document.getElementById('back').onclick=()=>navigate('all');document.getElementById('edit').onclick=()=>form(id);document.getElementById('delete').onclick=async()=>{if(confirm('この同人誌を削除しますか？')){await remove(id);navigate('all')}}}
function pairUI(){let options=unique([...books.filter(b=>b.genre===val('genre')).flatMap(b=>b.pairs||[]),...draftPairs]);document.getElementById('pairChoices').innerHTML=options.map(p=>`<div class="pairline"><input type="checkbox" id="cp_${encodeURIComponent(p)}" value="${esc(p)}" ${draftPairs.includes(p)?'checked':''}><label for="cp_${encodeURIComponent(p)}">${esc(p)}</label></div>`).join('')||'<small>新しいCPを追加してください。</small>';document.querySelectorAll('#pairChoices input').forEach(el=>el.onchange=()=>{draftPairs=unique([...document.querySelectorAll('#pairChoices input:checked')].map(e=>e.value))})}
function form(id=null){screen='form';editing=id;let b=books.find(x=>x.id===id)||{title:'',genre:'',pairs:[],circle:'',author:'',rating:'全年齢',price:'',location:'',notes:'',cover:''};draftPairs=[...(b.pairs||[])];coverData=b.cover||'';app.innerHTML=`<h2>${id?'同人誌を編集':'同人誌を登録'}</h2><form id="bookForm" class="panel"><label>表紙画像</label><div id="coverPreview">${coverData?`<img class="detailcover" src="${coverData}" alt="表紙">`:'<p class="muted">未設定</p>'}</div><input type="file" id="coverInput" accept="image/*"><small>画像は端末内に保存します。大きな画像は自動で縮小します。</small><label>タイトル *</label><input id="title" required value="${esc(b.title)}" placeholder="タイトル"><label>原作・ジャンル *</label><input id="genre" required list="genreList" value="${esc(b.genre)}" placeholder="例：鬼滅の刃"><datalist id="genreList">${unique(books.map(x=>x.genre)).map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label>カップリング（複数選択可）</label><div id="pairChoices"></div><div class="row"><input id="newPair" placeholder="例：義勇×炭治郎"><button type="button" class="btn alt" id="addPair">追加</button></div><label>サークル名</label><input id="circle" list="circleList" value="${esc(b.circle)}"><datalist id="circleList">${unique(books.map(x=>x.circle)).map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label>作家名</label><input id="author" list="authorList" value="${esc(b.author)}"><datalist id="authorList">${unique(books.map(x=>x.author)).map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label>年齢区分</label><select id="rating"><option ${b.rating==='全年齢'?'selected':''}>全年齢</option><option ${b.rating==='R18'?'selected':''}>R18</option></select><label>購入金額（円）</label><input id="price" type="number" min="0" value="${esc(b.price)}"><label>家の中の保管場所</label><input id="location" list="locationList" value="${esc(b.location)}"><datalist id="locationList">${unique(books.map(x=>x.location)).map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label>メモ・あらすじ</label><textarea id="notes" rows="4">${esc(b.notes)}</textarea><div id="dupe" class="hidden notice"></div><div class="row" style="margin-top:18px"><button type="submit" class="btn grow">保存する</button><button type="button" class="btn alt" id="cancel">キャンセル</button></div></form>`;pairUI();document.getElementById('genre').oninput=()=>{draftPairs=[];pairUI()};document.getElementById('addPair').onclick=()=>{let p=val('newPair').trim();if(p){draftPairs=unique([...draftPairs,p]);document.getElementById('newPair').value='';pairUI()}};document.getElementById('coverInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{coverData=await resize(f);document.getElementById('coverPreview').innerHTML=`<img class="detailcover" src="${coverData}" alt="表紙">`}catch{alert('画像を読み込めませんでした')}};document.getElementById('cancel').onclick=()=>navigate('all');const dupe=()=>{let t=val('title').trim().toLowerCase(),c=val('circle').trim().toLowerCase();let found=t&&books.find(x=>x.id!==id&&x.title.trim().toLowerCase()===t&&(!c||x.circle.trim().toLowerCase()===c));let el=document.getElementById('dupe');el.classList.toggle('hidden',!found);el.textContent=found?'⚠ 登録済みの可能性があります。同じタイトル'+(c?'・サークル':'')+'の本が存在します。':''};['title','circle'].forEach(x=>document.getElementById(x).oninput=dupe);document.getElementById('bookForm').onsubmit=async e=>{e.preventDefault();let data={id:id||crypto.randomUUID(),title:val('title').trim(),genre:val('genre').trim(),pairs:draftPairs,cover:coverData,circle:val('circle').trim(),author:val('author').trim(),rating:val('rating'),price:val('price'),location:val('location').trim(),notes:val('notes'),updated:Date.now()};try{await put(data);navigate('all')}catch(err){alert('保存できませんでした。端末の空き容量やブラウザ設定を確認してください。')}}}
function resize(file){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),image=new Image();image.onload=()=>{let max=900,scale=Math.min(1,max/Math.max(image.width,image.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(image.width*scale));c.height=Math.max(1,Math.round(image.height*scale));c.getContext('2d').drawImage(image,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.75))};image.onerror=()=>{URL.revokeObjectURL(url);reject()};image.src=url})}function download(name,data){let blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}function settings(){return `<h2>設定・バックアップ</h2><div class="panel"><label>テーマカラー</label><input type="color" id="accent" value="${esc(localStorage.getItem('dl-accent')||'#bd8098')}"><p class="muted">好きな色に変更できます。</p></div><div class="panel"><h3>バックアップ</h3><p>表紙画像と本の情報をまとめてJSONファイルに保存できます。ファイルはiCloud Driveなど安全な場所に保管してください。</p><button class="btn full" id="export">バックアップを書き出す</button><button class="btn alt full" style="margin-top:10px" id="import">バックアップから復元</button><p class="notice">復元時は現在のデータを置き換えます。復元前にバックアップを取ってください。</p></div><div class="panel"><h3>プライバシーと保存</h3><p>この初期版は登録データをブラウザのIndexedDBに保存します。自動クラウド同期はありません。SafariのWebサイトデータ削除、プライベートブラウズ、端末故障などでデータが失われる場合があります。</p><p>バックアップには表紙画像やR18の分類なども含まれます。ファイルの共有先にご注意ください。</p></div>`}function render(){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('selected',x.dataset.nav===screen));if(screen==='shelf')app.innerHTML=shelf();else if(screen==='all'){app.innerHTML=allPage();updateResults();document.getElementById('search').oninput=e=>{filter.q=e.target.value;updateResults()};document.querySelectorAll('[data-filter]').forEach(el=>el.onchange=()=>{filter[el.dataset.filter]=el.value;updateResults()});document.getElementById('clearFilters').onclick=()=>{filter={};render()}}else if(screen==='settings'){app.innerHTML=settings();document.getElementById('accent').oninput=e=>{localStorage.setItem('dl-accent',e.target.value);document.documentElement.style.setProperty('--accent',e.target.value)};document.getElementById('export').onclick=()=>download('doujinshi-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'doujinshi-library',version:1,exportedAt:new Date().toISOString(),books},null,2));document.getElementById('import').onclick=()=>document.getElementById('backupFile').click()}}
document.getElementById('backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.format!=='doujinshi-library'||!Array.isArray(data.books)||data.books.some(b=>typeof b.id!=='string'||typeof b.title!=='string'||!Array.isArray(b.pairs)))throw Error('対応していないファイルです');if(!confirm(`${data.books.length}冊を復元します。現在の${books.length}冊は置き換えられます。続けますか？`))return;await new Promise((res,rej)=>{let t=db.transaction('books','readwrite'),s=t.objectStore('books');s.clear();for(let b of data.books)s.put(b);t.oncomplete=res;t.onerror=()=>rej(t.error)});await reload();genre=null;pair=null;navigate('shelf');alert('復元しました')}catch(err){alert('復元に失敗しました：'+err.message)}finally{e.target.value=''}};
document.getElementById('addTop').onclick=()=>form();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{genre=null;pair=null;navigate(b.dataset.nav)});document.addEventListener('click',e=>{let x=e.target.closest('[data-genre],[data-pair],[data-root],[data-genreback],[data-open],[data-view]');if(!x)return;if(x.dataset.genre){genre=x.dataset.genre;pair=null;navigate('shelf')}else if(x.hasAttribute('data-pair')){pair=x.dataset.pair;navigate('shelf')}else if(x.dataset.root){genre=null;pair=null;navigate('shelf')}else if(x.dataset.genreback){pair=null;navigate('shelf')}else if(x.dataset.open)detail(x.dataset.open);else if(x.dataset.view){view=x.dataset.view;localStorage.setItem('dl-view',view);if(screen==='all')updateResults();else render()}});openDB().then(reload).then(render).catch(()=>app.innerHTML='<div class="notice">このブラウザではデータ保存を利用できません。Safariの通常モードで開いてください。</div>');
</script></body></html>
